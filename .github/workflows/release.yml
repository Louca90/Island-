name: Release APK

# Every push to main that touches the app builds the APK and publishes it
# as a release named after versionName (app/build.gradle.kts), e.g. v1.9.
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Version
        id: v
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build
        # Dependency downloads sometimes fail on the runner ("Too many retries"): try up to 3 times.
        run: |
          for i in 1 2 3; do
            gradle assembleRelease --no-daemon && exit 0
            echo "Build attempt $i failed, retrying in 30 s…"; sleep 30
          done
          exit 1
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk "Island-v${{ steps.v.outputs.name }}.apk"
      - name: Publish release
        # GitHub's release API sometimes answers 500: retry, and if the release already
        # exists (half-created by a failed attempt), just (re)upload the APK into it.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.name }}
        run: |
          for i in $(seq 1 12); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" Island-*.apk --clobber && gh release edit "$TAG" --draft=false --latest && exit 0
            else
              gh release create "$TAG" Island-*.apk --target "$GITHUB_SHA" --title "Island $TAG" \
                --notes "APK signé, s'installe par-dessus la version précédente." --latest && exit 0
            fi
            echo "Attempt $i failed, retrying in 50 s…"; sleep 50
          done
          exit 1
