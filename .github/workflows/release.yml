name: Release APK

# Every push to main that touches the app builds the APK and publishes it
# as a release named after versionName (app/build.gradle.kts), e.g. v1.9.
on:
  push:
    branches: [main]
    paths: ['app/**', '*.gradle.kts', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Version
        id: v
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Build
        # Dependency downloads sometimes fail on the runner ("Too many retries"): try up to 3 times.
        run: |
          for i in 1 2 3; do
            gradle assembleRelease --no-daemon && exit 0
            echo "Build attempt $i failed, retrying in 30 s…"; sleep 30
          done
          exit 1
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk "Island-v${{ steps.v.outputs.name }}.apk"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: Island v${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: Island-*.apk
          generate_release_notes: true
